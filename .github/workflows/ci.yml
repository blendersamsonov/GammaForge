name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python: "3.12"
            constraints: requirements/minimum.txt
          - name: current
            python: "3.14"
            constraints: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - if: matrix.constraints != ''
        run: python -m pip install -e ".[dev]" -c ${{ matrix.constraints }}
      - if: matrix.constraints == ''
        run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -c "import gammaforge; print(gammaforge.__file__)"
      - run: make check
      - run: python -m gammaforge.validation.run --alpha

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gui]"
      - run: python -m pip check
      - run: python -m pytest -q tests/test_gui_boundary.py tests/test_gui_controller.py tests/test_gui_inputs.py tests/test_gui_plotting.py

  symbolic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,symbolic]"
      - run: python -m pip check
      - run: python -m pytest -q tests/test_verifications.py
      - run: python scripts/verifications/verify_all.py der004

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python -m venv /tmp/gammaforge-wheel-smoke
      - run: /tmp/gammaforge-wheel-smoke/bin/python -m pip install dist/*.whl
      - run: /tmp/gammaforge-wheel-smoke/bin/python -m pip check
      - run: /tmp/gammaforge-wheel-smoke/bin/python -c "import gammaforge; print(gammaforge.__file__)"
        working-directory: /tmp
      - run: /tmp/gammaforge-wheel-smoke/bin/python -m gammaforge.validation.run --alpha
        working-directory: /tmp

  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gui,browser]"
      - run: python -m pip check
      - run: python -m playwright install --with-deps chromium
      - run: GAMMAFORGE_BROWSER_TEST=1 python -m pytest -q tests/test_gui_browser.py
