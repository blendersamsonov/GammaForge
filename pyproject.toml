[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gammaforge"
version = "0.0.0"
description = "Compton-photon simulation toolkit: electron-bunch / laser-pulse interaction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pint>=0.23",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
jit = ["numba>=0.59"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gammaforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
