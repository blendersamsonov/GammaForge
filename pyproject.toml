[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gammaforge"
version = "0.1.0a1"
description = "Compton-photon simulation toolkit: electron-bunch / laser-pulse interaction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pint>=0.25",
    "h5py>=3.11",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.4",
]

[project.optional-dependencies]
gui = ["nicegui>=3.16,<4", "plotly>=6,<7"]
gpu = ["cupy-cuda12x"]
jit = ["numba>=0.59"]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.48"]
symbolic = ["sympy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/gammaforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tier0: Tier 0 fast contract, unit-boundary, format, and persistence checks (< 5s)",
    "tier1: Tier 1 fast component physics, optics, kinematics, and schema checks (< 5s)",
    "tier2: Tier 2 numerical integration, trajectory tracking, and validation harness (< 30s)",
    "tier3: Tier 3 heavy Monte Carlo, high-order quadrature refinement, and slow physics (> 30s)",
    "fast: quick development tier combining Tier 0 and Tier 1 (< 30s total)",
    "heavy: slow computations (Tier 3) including high-order refinement and large MC (> 30s)",
    "symbolic: SymPy symbolic derivation verifications",
    "browser: Playwright browser tests",
    "gpu: CuPy / CUDA GPU tests",
]
